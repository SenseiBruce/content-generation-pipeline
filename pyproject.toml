[project]
name = "content-generation-pipeline"
version = "0.1.0"
description = "Capital Architects YouTube Shorts automation pipeline"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "feedparser==6.0.11",
    "requests==2.33.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "pillow==12.3.0",
    "google-api-python-client==2.136.0",
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.1",
    "google-auth-httplib2==0.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-socket==0.7.0",
    "ruff==0.6.9",
    "pip-tools==7.4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Entry scripts insert the project root onto sys.path before importing agents.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.coverage.run]
source = ["agents", "pipeline"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
pretty = true
files = ["agents", "pipeline"]
disable_error_code = ["import-untyped"]
